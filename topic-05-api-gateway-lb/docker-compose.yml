services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - service-a
      - service-b
    networks:
      - gateway-net

  service-a:
    build: ./service-a
    container_name: api-gw-service-a
    environment:
      - PORT=3005
      - INSTANCE_ID=service-a-instance-1
    networks:
      - gateway-net

  service-b:
    build: ./service-b
    container_name: api-gw-service-b
    environment:
      - PORT=3006
      - INSTANCE_ID=service-b-instance-1
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
