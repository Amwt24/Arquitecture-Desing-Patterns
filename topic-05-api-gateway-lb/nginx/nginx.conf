user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream="$upstream_addr" '
                      'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # === LOAD BALANCER: upstream pools (round-robin by default) ===
    upstream service_a_pool {
        server service-a:3005;
        # Additional instances would be added here for real load balancing:
        # server service-a-2:3005;
        # server service-a-3:3005;
        keepalive 32;
    }

    upstream service_b_pool {
        server service-b:3006;
        keepalive 32;
    }

    # === API GATEWAY + REVERSE PROXY ===
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Request-ID $request_id always;

        # === API Gateway routing rules ===

        # Route /api/users/* → Service A (User Service)
        location /api/users {
            proxy_pass http://service_a_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Route /api/products/* → Service B (Product Service)
        location /api/products {
            proxy_pass http://service_b_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Health check for all upstream services
        location /health {
            access_log off;
            return 200 '{"status":"ok","component":"nginx-api-gateway"}';
            add_header Content-Type application/json;
        }

        # Nginx status (monitoring)
        location /nginx-status {
            stub_status on;
            access_log off;
        }
    }
}
