services:
  lambda-simulator:
    build: ./lambda-simulator
    container_name: serverless-lambda-sim
    environment:
      - PORT=3003
      - FUNCTION_NAME=ArchPatterns-DataProcessor
      - FUNCTION_TIMEOUT_MS=15000
      - MEMORY_LIMIT_MB=512
    ports:
      - "3003:3003"
    networks:
      - serverless-net

  ecs-service:
    build: ./ecs-service
    container_name: serverless-ecs-service
    environment:
      - PORT=3004
      - TASK_ID=fargate-task-001
      - CLUSTER_NAME=ArchPatterns-Cluster
      - TASK_CPU=256
      - TASK_MEMORY=512
    ports:
      - "3004:3004"
    networks:
      - serverless-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  serverless-net:
    driver: bridge
